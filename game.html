<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<title>Нянька</title>
<style>
#rotate-warning {
    display: none; 
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background-color: #000000;
    z-index: 99999;
    justify-content: center;
    align-items: center;
}
.warning-text {
    font-size: 16px;
    line-height: 1.6;
    color: #dddddd;
    font-family: Arial, sans-serif;
    text-align: center;
    max-width: 400px;
    padding: 20px;
    box-sizing: border-box;
}
@media (orientation: portrait) {
    #rotate-warning { display: flex; }
}
:root{--bg:#020203;--ink:#ece6e0;--dim:#a89a90;--red:#b3201a;--warm:#ffb347;--panel:rgba(10,8,8,.72);color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none}
.hidden{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none}
button{font:inherit;color:inherit;cursor:pointer;pointer-events:auto}
button:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
#stat{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;font:600 13px/1.4 'Courier New',monospace;background:var(--panel);padding:5px 9px;border-radius:8px}
#nz{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;font:700 13px 'Courier New',monospace;background:var(--panel);padding:5px 9px;border-radius:8px}
#msg{position:fixed;top:calc(env(safe-area-inset-top,0px) + 60px);left:50%;transform:translateX(-50%);width:min(92%,480px);text-align:center;font-size:14px;line-height:1.4;background:var(--panel);padding:8px 12px;border-radius:10px;opacity:0;transition:opacity .4s}
#joy{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:110px;height:110px;border:2px solid rgba(236,230,224,.25);border-radius:50%}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(236,230,224,.3)}
#act,#thr{position:fixed;right:16px;border:2px solid var(--warm);border-radius:14px;background:var(--panel);font-weight:600;font-size:15px;padding:8px 12px;max-width:50vw}
#act{bottom:calc(env(safe-area-inset-bottom,0px) + 50px);min-width:140px;min-height:60px}
#thr{bottom:calc(env(safe-area-inset-bottom,0px) + 125px);min-height:44px;font-size:13px;border-color:#6fb1ff}
#hid{position:fixed;inset:0;pointer-events:none;background:linear-gradient(#000 0 40%,transparent 40% 54%,#000 54%)}
#scr{position:fixed;inset:0;z-index:8;background:#2a0000;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:fl .1s steps(2) infinite}
@keyframes fl{50%{background:#e00}}
@keyframes zm{from{transform:scale(.4) rotate(-3deg)}to{transform:scale(1.7) rotate(3deg)}}
.face{position:relative;width:70vmin;height:90vmin;border-radius:45% 45% 40% 40%;background:radial-gradient(circle at 50% 35%,#d9d4cc,#8c857b 70%,#3a3430);animation:zm .35s ease-in forwards}
.face i{position:absolute;background:#000;border-radius:50%}
.e1,.e2{top:28%;width:22%;height:14%;box-shadow:inset 0 0 0 5px #bfb8ad}
.e1{left:18%}.e2{right:18%}
.hr{left:0;right:0;top:-8%;height:30%;border-radius:50% 50% 0 0;background:#c9c9c9!important}
.mo{left:22%;right:22%;bottom:10%;height:26%;border-radius:20% 20% 50% 50%;background:repeating-linear-gradient(90deg,#e8e0d0 0 7px,#5a0505 7px 16px)!important;box-shadow:0 0 30px #a00 inset}
.bl{left:44%;top:40%;width:6%;height:40%;border-radius:40%;background:#8a0a0a!important}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 190px);transform:translateX(-50%);background:var(--red);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90%}
#ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;background:rgba(2,2,3,.95)}
#ot{margin:0;font:700 clamp(1.8rem,8vw,2.6rem)/1.1 'Courier New',monospace;color:var(--red)}
#op{margin:0;max-width:440px;line-height:1.5;white-space:pre-line}
#ob{display:grid;gap:10px;width:min(100%,360px)}
.btn{padding:14px 16px;border:2px solid var(--ink);border-radius:12px;background:transparent;color:var(--ink);font:600 16px system-ui,sans-serif}
@media (orientation:landscape){#toast{bottom:calc(env(safe-area-inset-bottom,0px) + 100px)}}
</style>
</head>

  var f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;

    if(pos.y <= 0){ pos.y = 0; vy = 0; onGround = true; }
  }
  cam.position.set(pos.x, camBase + 1.55 + pos.y, pos.z);
}
  cam.rotation.set(pitch,yaw,0);
  ITEMS.forEach(function(it){it.m.rotation.y+=dt*2});
  
  if(playing&&!tr){
    var best=null,bd=99,d;
    if(hidden>=0){actK={t:'out'};$('act').textContent=L('Выйти из укрытия');$('act').classList.remove('hidden')}
    else{
      ITEMS.forEach(function(it){if(it.f!==pf)return;d=dist(pos.x,pos.z,it.x,it.z);if(d<1.7&&d<bd){bd=d;best=it}});
      HIDES.forEach(function(h){if(h.f!==pf)return;d=dist(pos.x,pos.z,h.c[0],h.c[1]);if(d<2&&d<bd){bd=d;best={t:'hide',h:h}}});
      d=dist(pos.x,pos.z,-2.3,pf===0?-2.85:2.85);if(d<1.7&&d<bd){bd=d;best={t:'stairs'}}
      if(pf===0){d=dist(pos.x,pos.z,0,5.8);if(d<1.8&&d<bd){bd=d;best={t:'door'}}}
      else if(lockD){d=dist(pos.x,pos.z,3,3);if(d<2&&d<bd){bd=d;best={t:'lock'}}}
      actK=best;
      if(best){$('act').textContent=labelOf(best);$('act').classList.remove('hidden')}else $('act').classList.add('hidden');
    }
    $('nz').textContent=L('Шум: ')+L(MODES[mode]);$('nz').style.color=MC[mode];
  }else $('act').classList.add('hidden');
  R.render(sc,cam);
}

var cut=null,T1=8,T2=11.6,T3=18.8;
function sting(){
  burst(.7,2000,1,'bandpass');burst(1,70,1.6,'lowpass');
  if(AC){var o=AC.createOscillator(),gg=AC.createGain();o.type='sawtooth';o.frequency.value=110;
    o.frequency.exponentialRampToValueAtTime(55,AC.currentTime+1.2);gg.gain.value=.35;
    gg.gain.exponentialRampToValueAtTime(.001,AC.currentTime+1.3);o.connect(gg);gg.connect(out);o.start();o.stop(AC.currentTime+1.3)}
}
function buildForest(FL){
  var s=new THREE.Scene();s.background=new THREE.Color(0x03060c);s.fog=new THREE.FogExp2(0x03060c,.028);
  function mt(c,e,nf){var x=new THREE.MeshLambertMaterial({color:c,emissive:e||0});if(nf)x.fog=false;return x}
  function bx(w,h,d,c,x,y,z,e,nf){var q=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mt(c,e,nf));q.position.set(x,y,z);s.add(q);return q}
  s.add(new THREE.AmbientLight(0x35486e,1.25));
  var md=new THREE.DirectionalLight(0x8fb0e0,.85);md.position.set(-20,30,40);s.add(md);
  var gd=new THREE.Mesh(new THREE.PlaneGeometry(260,260),mt(0x0c1511));gd.rotation.x=-Math.PI/2;s.add(gd);
  var pt=new THREE.Mesh(new THREE.PlaneGeometry(3.2,140),mt(0x1c1812));pt.rotation.x=-Math.PI/2;pt.position.set(0,.02,70);s.add(pt);
  var mn=new THREE.Mesh(new THREE.SphereGeometry(6,16,12),new THREE.MeshBasicMaterial({color:0xe6edff,fog:false}));mn.position.set(-30,46,-85);s.add(mn);
  var sa=new Float32Array(300),i;
  for(i=0;i<100;i++){var an=Math.random()*Math.PI*2,rr=40+Math.random()*60;sa[i*3]=Math.cos(an)*rr*2;sa[i*3+1]=25+Math.random()*50;sa[i*3+2]=Math.sin(an)*rr*2}
  var sg=new THREE.BufferGeometry();sg.setAttribute('position',new THREE.BufferAttribute(sa,3));
  s.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.4,sizeAttenuation:false,fog:false})));
  
  var tg=new THREE.CylinderGeometry(.22,.3,5,6),fg=new THREE.ConeGeometry(1.6,6,7),tm=mt(0x150f0a),fm=mt(0x07140d);
  function tree(x,z){var h=.8+Math.random()*.7,t=new THREE.Mesh(tg,tm);t.position.set(x,2.5*h,z);t.scale.y=h;s.add(t);
    var f=new THREE.Mesh(fg,fm);f.position.set(x,5.2*h+1,z);f.scale.set(h,h*(1+Math.random()*.4),h);s.add(f)}
  for(var z=10;z<=95;z+=1.7){var sd=Math.random()<.5?-1:1;tree(sd*(3.2+Math.random()*3),z+Math.random());tree(-sd*(4+Math.random()*10),z+Math.random()*1.5)}
  for(var k=0;k<40;k++)tree((Math.random()<.5?-1:1)*(10+Math.random()*30),-10+Math.random()*110);
  
  var H=FL*3.2,wall=0x4a3f36,FZ=6.05;
  bx(18,H,10.5,wall,0,H/2,-.75);bx(.4,H,1.6,wall,-9,H/2,5.2);bx(.4,H,1.6,wall,9,H/2,5.2);
  var rf=0x241d19,r1=bx(19.5,.35,8,rf,0,H+1.5,3);r1.rotation.x=.5;var r2=bx(19.5,.35,8,rf,0,H+1.5,-3);r2.rotation.x=-.5;
  function seg(x0,x1,y0,y1){if(x1-x0<.01||y1-y0<.01)return;bx(x1-x0,y1-y0,.3,wall,(x0+x1)/2,(y0+y1)/2,FZ)}
  var base=(FL-1)*3.2,hy0=base+1,hy1=base+2.4,mid=base+1.7;
  for(var f2=0;f2<FL;f2++){
    var b0=f2*3.2,b1=b0+(f2===FL-1?3:3.2);
    if(f2===FL-1){seg(-9,3.7,b0,b1);seg(5.3,9,b0,b1);seg(3.7,5.3,b0,hy0);seg(3.7,5.3,hy1,b1)}else seg(-9,9,b0,b1);
    [-4.5,4.5].forEach(function(x){
      var y=b0+1.7,hole=(f2===FL-1&&x===4.5);
      if(!hole)bx(1.6,1.4,.06,0x0e1a30,x,y,FZ+.18,0x050a14);
      bx(1.8,.12,.14,0x2a1f18,x,y+.76,FZ+.2);bx(1.8,.12,.14,0x2a1f18,x,y-.76,FZ+.2);
      bx(.12,1.5,.14,0x2a1f18,x-.85,y,FZ+.2);bx(.12,1.5,.14,0x2a1f18,x+.85,y,FZ+.2);
    });
  }
  
  bx(1.6,2.4,.1,0x020203,0,1.2,FZ+.22);bx(.08,2.4,1.5,0x3a2418,-.85,1.2,FZ+1);
  bx(1.9,.14,.2,0x2a1f18,0,2.46,FZ+.25);
  var pl=new THREE.PointLight(0xffa860,1.1,9);pl.position.set(0,2.4,FZ+1.5);s.add(pl);
  
  var glass=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.4,.04),new THREE.MeshLambertMaterial({color:0x445566,transparent:true,opacity:.22,depthWrite:false}));
  glass.material.fog=false;glass.position.set(4.5,mid,FZ+.17);s.add(glass);
  var lit=bx(1.6,1.4,.1,0x050505,4.5,mid,4.6,0,true);
  var ll=new THREE.PointLight(0xffb060,0,8);ll.position.set(4.5,mid,5.6);s.add(ll);
  var nan=buildNanny();nan.position.set(4.5,base,5.5);nan.visible=false;
  nan.traverse(function(o){if(o.material)o.material.fog=false});nan.children[5].scale.set(1.8,1.8,1.8);nan.children[6].scale.set(1.8,1.8,1.8);s.add(nan);
  var cam2=new THREE.PerspectiveCamera(74,innerWidth/innerHeight,.1,200);cam2.rotation.order='YXZ';
  return {s:s,cam:cam2,nan:nan,lit:lit,light:ll,mid:mid};
}
function startCut(done){
  var f=buildForest(2);
  var fade=document.createElement('div');fade.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;background:#000;opacity:1;transition:opacity 1.2s;z-index:50;pointer-events:none';
  var sk=document.createElement('button');sk.textContent=L('Пропустить');
  sk.style.cssText='position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:51;min-height:44px;padding:8px 14px;border:2px solid #ece6e0;border-radius:12px;background:rgba(10,8,8,.6);color:#ece6e0;font:600 14px system-ui,sans-serif;opacity:0;transition:opacity .6s';
  document.body.appendChild(fade);document.body.appendChild(sk);
  ['hud','hid'].forEach(function(i){$(i).classList.add('hidden')});$('toast').style.opacity=0;
  $('vig').style.background='radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.8) 100%)';
  cut={f:f,t:0,ph:0,fs:0,br:0,hb:0,rev:false,fin:false,fade:fade,sk:sk,done:done};
  sk.addEventListener('click',function(){if(cut&&!cut.fin)cut.t=Math.max(cut.t,T3)});
  requestAnimationFrame(function(){fade.style.opacity=0});
  setTimeout(function(){sk.style.opacity=1},1800);
}
function cutStep(dt){
  var c=cut,f=c.f,cm=f.cam,t;
  c.t+=dt;t=c.t;
  var vm=5.4,vn=t<T1?Math.min(1,t/1):Math.max(0,1-(t-T1)/.9);
  var mm=Math.min(Math.max(t-T1,0),.9);
  var z0=7.5+vm*(T1-.5)+vm*.45;
  var z=t<T1?7.5+(t<1?vm*t*t/2:vm*(t-.5)):7.5+vm*(T1-.5)+vm*(mm-mm*mm/1.8);
  var u=t-T2,sv=0;
  if(u>0){sv=Math.min(1,u/6.5);sv=sv*sv*(3-2*sv);z=z0+(24-z0)*sv}
  c.ph+=dt*10*vn;
  if(vn>.3){
    c.fs-=dt*vn;if(c.fs<=0){c.fs=.29;burst(.05,230,.6,'lowpass');if(Math.random()<.25)burst(.03,3200,.35,'highpass')}
    c.br-=dt;if(c.br<=0){c.br=.55;burst(.22,900,.1,'bandpass')}
  }
  var k=Math.min(1,Math.max(0,(t-T1)/1.7)),e=k*k*(3-2*k);
  var ya=Math.atan2(4.5,z-6)*sv,pv=Math.atan2(f.mid-1.55,z-6)*sv;
  cm.position.set(Math.sin(c.ph*.5)*.12*vn,1.55+Math.abs(Math.sin(c.ph))*.1*vn,z);
  if(u>0){cm.position.x+=(Math.random()-.5)*.012;cm.position.y+=(Math.random()-.5)*.012}
  cm.rotation.set(Math.sin(c.ph)*.02*vn+.07*e+pv,Math.PI+Math.PI*e+Math.sin(c.ph*.5)*.03*vn-ya,Math.sin(c.ph*.5)*.02*vn);
  
  if(t>T1+1.7){c.hb-=dt;if(c.hb<=0){c.hb=u>0?.5:.8;burst(.09,60,.9,'lowpass');setTimeout(function(){burst(.07,55,.6,'lowpass')},140)}}
  
  if(u>=0&&!c.rev){c.rev=true;f.nan.visible=true;sting()}
  var on=u>=0&&!(u>=.12&&u<.24);
  f.lit.material.emissive.setHex(on?0x7a3a0c:0);f.lit.material.color.setHex(on?0xc8641a:0x050505);f.light.intensity=on?1.3:0;
  if(u>=0){
    var fv=74-52*sv;
    if(cm.fov!==fv){cm.fov=fv;cm.updateProjectionMatrix()}
    f.nan.rotation.y=Math.sin(t*.9)*.15;f.nan.position.z=5.5+Math.min(.3,u*.07);
  }
  if(t>=T3&&!c.fin){
    c.fin=true;c.fade.style.opacity=1;c.sk.style.opacity=0;
    setTimeout(function(){
      if(c.fade.parentNode)c.fade.parentNode.removeChild(c.fade);
      if(c.sk.parentNode)c.sk.parentNode.removeChild(c.sk);
      cut=null;c.done();
    },1400);
  }
  R.render(f.s,cm);
}
